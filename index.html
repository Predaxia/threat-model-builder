<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threat Model Builder — Predaxia</title>
<meta name="description" content="Build your personal threat model in 3 minutes. 7 profiles, personalized score, actionable steps. No data collected, no account needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
@keyframes tmb-fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
body{background:#0a0a0a;color:#e8e8e8;font-family:'Inter',system-ui,sans-serif;margin:0;padding:0}
#tmb{max-width:720px;margin:0 auto;padding:40px 24px 80px}
.tmb-fade{animation:tmb-fade 0.35s ease-out}
.tmb-progress{display:flex;gap:4px;margin-bottom:40px}
.tmb-pdot{flex:1;height:3px;background:#1a1a1a;transition:background 0.4s}
.tmb-pdot.done{background:#c0392b}
.tmb-pdot.active{background:#c0392b88}
.tmb-slabel{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#c0392b;margin-bottom:8px}
.tmb-stitle{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.1rem,3vw,1.4rem);font-weight:700;color:#e8e8e8;margin-bottom:8px;line-height:1.2}
.tmb-sdesc{font-size:13px;color:#777;margin-bottom:32px;line-height:1.5}
.tmb-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tmb-pcard{background:#111;border:1px solid #1e1e1e;padding:20px 16px;cursor:pointer;transition:all 0.2s;text-align:left}
.tmb-pcard.sel{background:#c0392b11;border-color:#c0392b}
.tmb-icon{font-size:22px;margin-bottom:8px;display:block}
.tmb-plabel{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:#e8e8e8;margin-bottom:4px}
.tmb-psub{font-size:11px;color:#666;line-height:1.4}
.tmb-anyone{margin-top:10px;display:flex;align-items:center;gap:16px}
.tmb-chk{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#111;border:1px solid #1e1e1e;cursor:pointer;transition:all 0.2s;margin-bottom:6px}
.tmb-chk.sel{background:#c0392b11;border-color:#c0392b}
.tmb-box{width:18px;height:18px;border:2px solid #333;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:#fff;transition:all 0.15s}
.tmb-box.on{border-color:#c0392b;background:#c0392b}
.tmb-clbl{font-size:14px;color:#ccc}
.tmb-dots{display:flex;gap:3px;margin-left:auto;flex-shrink:0}
.tmb-dot{width:6px;height:6px;border-radius:50%;background:#333}
.tmb-dot.on{background:#c0392b}
.tmb-srow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1a1a1a;flex-wrap:wrap;gap:8px}
.tmb-sq{font-size:14px;color:#ccc;font-weight:500;min-width:160px}
.tmb-sopts{display:flex;gap:6px;flex-wrap:wrap}
.tmb-sbtn{font-size:11px;padding:6px 12px;background:#1a1a1a;color:#888;border:1px solid #252525;cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;white-space:nowrap}
.tmb-sbtn.sel{background:#c0392b;color:#fff;border-color:#c0392b}
.tmb-nav{display:flex;justify-content:space-between;margin-top:40px}
.tmb-btn{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:14px 32px;cursor:pointer;transition:all 0.2s;border:none}
.tmb-btn.pri{background:#c0392b;color:#fff}
.tmb-btn.pri.dis{background:#441a15;color:#666;cursor:not-allowed}
.tmb-btn.sec{background:transparent;color:#888;border:1px solid #333}
.tmb-score{width:100px;height:100px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;border-width:3px;border-style:solid}
.tmb-snum{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:800;line-height:1}
.tmb-slbl2{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#666;margin-top:4px}
.tmb-vuln{background:#111;padding:16px 20px;margin-bottom:10px;border-left:3px solid}
.tmb-vtitle{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:#e8e8e8;margin-bottom:6px}
.tmb-vsev{font-size:10px;font-weight:400;margin-left:8px;text-transform:uppercase;letter-spacing:1px}
.tmb-vtxt{font-size:13px;color:#999;line-height:1.5;margin-bottom:8px}
.tmb-alink{font-size:12px;color:#c0392b;text-decoration:none;font-weight:600}
.tmb-sectitle{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#c0392b;margin:40px 0 16px}
.tmb-rcard{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#111;border-bottom:1px solid #1a1a1a;text-decoration:none;color:#ccc;font-size:14px;line-height:1.4}
.tmb-rarrow{margin-left:auto;color:#c0392b;font-size:14px;flex-shrink:0}
.tmb-closebox{border-top:1px solid #1e1e1e;margin-top:48px;padding-top:32px;text-align:center}
.tmb-closing{font-size:13px;color:#555;font-style:italic;line-height:1.6;max-width:500px;margin:0 auto 24px}
.tmb-ctabox{background:#111;border:1px solid #1e1e1e;padding:24px;text-align:center}
.tmb-ctatitle{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:#e8e8e8;margin-bottom:8px}
.tmb-ctatxt{font-size:13px;color:#777;margin-bottom:16px;line-height:1.5}
.tmb-sharebtn{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:10px 24px;background:transparent;color:#c0392b;border:1px solid #c0392b;cursor:pointer;margin-top:12px}
.tmb-privnote{font-size:11px;color:#444;text-align:center;margin-top:32px;font-style:italic}
.tmb-restart{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:10px 24px;background:transparent;color:#555;border:1px solid #252525;cursor:pointer;display:block;margin:24px auto 0}
@media(max-width:480px){.tmb-grid2{grid-template-columns:1fr}.tmb-srow{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

vpn:{"Mullvad/Proton":0,"Other paid":1,"Free VPN":3,"None":2},

twofa:{"Hardware key":0,"Auth app":0,"SMS codes":2,"None":3},

};

messaging:{high:{text:"Your messaging is a critical vulnerability. Switch to Signal with disappearing messages enabled.",article:"/signal-vs-protonmail-vs-wire/",articleTitle:"Signal vs ProtonMail vs Wire"},medium:{text:"Your messaging could expose metadata. Consider Signal for sensitive communications.",article:"/signal-vs-protonmail-vs-wire/",articleTitle:"Signal vs ProtonMail vs Wire"}},
vpn:{high:{text:"Without a trustworthy VPN, your ISP logs every site you visit. Free VPNs sell your data.",article:"/free-vpns-sell-your-data/",articleTitle:"Free VPNs sell your data"},medium:{text:"Verify your VPN provider's no-logs policy and jurisdiction.",article:"/proton-vs-mullvad-2026/",articleTitle:"Proton vs Mullvad"}},
passwords:{high:{text:"No password manager means reused passwords. One breach exposes everything.",article:"/1password-review-for-journalists/",articleTitle:"1Password review for journalists"},medium:{text:"Consider 1Password's Travel Mode if you cross borders with sensitive data.",article:"/1password-review-for-journalists/",articleTitle:"1Password review"}},

};

var s={step:0,profile:null,assets:[],adversaries:[],setup:{},copied:false};

function render(){
var h="";
// Progress bar
if(s.step<5){
h+='<div class="tmb-progress">';
for(var i=0;i<5;i++){
var cls="tmb-pdot";
if(i<s.step)cls+=" done";
if(i===s.step)cls+=" active";
h+='<div class="'+cls+'"></div>';
}
h+='</div>';
}

// Step 0: Profile
if(s.step===0){
h+='<div class="tmb-fade">';
h+='<div class="tmb-slabel">STEP 1 OF 5</div>';
h+='<div class="tmb-stitle">Who are you?</div>';
h+='<div class="tmb-sdesc">Your profile determines your threat landscape. Pick the one that fits best.</div>';

h+='</div>';
}
h+='</div>';
var ap=P[P.length-1];
var asel=s.profile==="anyone"?" sel":"";

h+='<div><div class="tmb-plabel">'+ap.label+'</div>';

if(s.step===1&&s.profile){
var items=AS[s.profile]||[];

h+='<div class="tmb-stitle">What are you protecting?</div>';
h+='<div class="tmb-sdesc">Select everything that matters. The more specific, the better the result.</div>';
for(var i=0;i<items.length;i++){

h+='<div class="tmb-clbl">'+items[i].label+'</div></div>';

h+='</div>';
}

// Step 2: Adversaries
if(s.step===2&&s.profile){
var items=ADV[s.profile]||[];
h+='<div class="tmb-fade">';
h+='<div class="tmb-slabel">STEP 3 OF 5</div>';
h+='<div class="tmb-stitle">Who are you protecting against?</div>';

for(var i=0;i<items.length;i++){

h+='<div class="tmb-chk'+(on?" sel":"")+'" data-adv="'+items[i].id+'">';

h+='</div></div>';
}
h+='</div>';
}

// Step 3: Setup
if(s.step===3){
h+='<div class="tmb-fade">';
h+='<div class="tmb-slabel">STEP 4 OF 5</div>';
h+='<div class="tmb-stitle">What\'s your current setup?</div>';

h+='</div></div>';
}
h+='</div>';
}

// Step 4: Results
if(s.step===4){

}

h+='<div class="tmb-sectitle">Recommended for your profile</div>';

h+='<div class="tmb-closebox">';

// Navigation
if(s.step<4){
var canN=false;
if(s.step===0)canN=!!s.profile;
if(s.step===1)canN=s.assets.length>0;
if(s.step===2)canN=s.adversaries.length>0;
if(s.step===3){var k=0;for(var x in s.setup)k++;canN=k>=3;}
h+='<div class="tmb-nav">';
if(s.step>0){h+='<button class="tmb-btn sec" id="tmb-back">\u2190 BACK</button>';}
else{h+='<div></div>';}
h+='<button class="tmb-btn pri'+(canN?"":" dis")+'" id="tmb-next"'+(canN?"":' disabled')+'>'+(s.step===3?"SEE RESULTS \u2192":"NEXT \u2192")+'</button>';
h+='</div>';
}

el.innerHTML=h;
bindE();
}

function bindE(){
var cards=el.querySelectorAll("[data-profile]");
for(var i=0;i<cards.length;i++){
cards[i].addEventListener("click",function(){s.profile=this.getAttribute("data-profile");render();});
}
var assets=el.querySelectorAll("[data-asset]");
for(var i=0;i<assets.length;i++){
assets[i].addEventListener("click",function(){
var id=this.getAttribute("data-asset");
var idx=s.assets.indexOf(id);
if(idx===-1)s.assets.push(id);else s.assets.splice(idx,1);
render();
});
}
var advs=el.querySelectorAll("[data-adv]");
for(var i=0;i<advs.length;i++){
advs[i].addEventListener("click",function(){
var id=this.getAttribute("data-adv");
var idx=s.adversaries.indexOf(id);
if(idx===-1)s.adversaries.push(id);else s.adversaries.splice(idx,1);
render();
});
}
var btns=el.querySelectorAll(".tmb-sbtn");
for(var i=0;i<btns.length;i++){
btns[i].addEventListener("click",function(){
s.setup[this.getAttribute("data-qid")]=this.getAttribute("data-val");
render();
});
}
var next=el.querySelector("#tmb-next");
if(next)next.addEventListener("click",function(){if(s.step<4)s.step++;render();el.scrollIntoView({behavior:"smooth"});});
var back=el.querySelector("#tmb-back");
if(back)back.addEventListener("click",function(){if(s.step>0)s.step--;render();el.scrollIntoView({behavior:"smooth"});});
var restart=el.querySelector("#tmb-restart");
if(restart)restart.addEventListener("click",function(){s={step:0,profile:null,assets:[],adversaries:[],setup:{},copied:false};render();el.scrollIntoView({behavior:"smooth"});});
var share=el.querySelector("#tmb-share");
if(share)share.addEventListener("click",function(){
var r=comp();
var pl="";for(var i=0;i<P.length;i++){if(P[i].id===s.profile)pl=P[i].label;}
var txt="My Threat Model Score: "+r.pct+"/100 ("+r.level+")\nProfile: "+pl+"\n"+r.vulns.length+" vulnerabilities identified\n\nBuild yours \u2192 predaxia.com/threat-model-builder/";
if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){s.copied=true;render();setTimeout(function(){s.copied=false;render();},2000);});}
});
}

function comp(){
var vulns=[];
var total=0;
var max=15;
for(var i=0;i<SQ.length;i++){
var q=SQ[i];
var ans=s.setup[q.id];
if(!ans)continue;
var sc=SC[q.id][ans]||0;
total+=sc;
var rec=REC[q.id];
if(sc>=2&&rec&&rec.high){vulns.push({text:rec.high.text,article:rec.high.article,articleTitle:rec.high.articleTitle,severity:"high",area:q.q});}
else if(sc===1&&rec&&rec.medium){vulns.push({text:rec.medium.text,article:rec.medium.article,articleTitle:rec.medium.articleTitle,severity:"medium",area:q.q});}
}
var sAdvs=ADV[s.profile]||[];
var maxSev=0;
for(var i=0;i<sAdvs.length;i++){if(s.adversaries.indexOf(sAdvs[i].id)!==-1&&sAdvs[i].severity>maxSev)maxSev=sAdvs[i].severity;}
if(maxSev===3)total+=2;
var pct=Math.max(0,Math.round(100-(total/max)*100));
var color=pct>=70?"#2ecc71":pct>=40?"#d4a017":"#c0392b";
var level=pct>=70?"SOLID":pct>=40?"EXPOSED":"CRITICAL";
return{vulns:vulns,pct:pct,color:color,level:level};
}

render();
})();
</script>
</body>
</html>
